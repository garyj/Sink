<style>
  :root {
    --crimson: #aa273e;
    --crimson-deep: #8d1935;
    --gold: #9b7f3f;
    --gold-deep: #7a5924;
    --paper: #f7f8fa;
    --line: #e2e5e9;
    --ink: #101828;
    --muted: #475467;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: clamp(1.5rem, 5vw, 4rem);
    background: var(--paper);
    color: var(--ink);
    font: 1.0625rem/1.6 var(--sans);
  }
  main {
    width: 100%;
    max-width: 64rem;
    display: grid;
    grid-template-columns: 1fr;
    gap: clamp(1.5rem, 4vw, 3rem);
    align-items: center;
  }
  .sign { width: min(100%, 30rem); margin-inline: auto; }
  .sign svg { display: block; width: 100%; height: auto; overflow: visible; }
  .message { max-width: 32rem; }
  h1 {
    margin: 0 0 1rem;
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(2.25rem, 5.5vw, 3.5rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
    color: var(--crimson-deep);
    text-wrap: balance;
  }
  p { margin: 0 0 2rem; color: var(--muted); max-width: 42ch; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }
  .button {
    display: inline-block;
    padding: 0.8rem 1.35rem;
    border: 2px solid var(--crimson-deep);
    border-radius: 3px;
    font-weight: 600;
    text-decoration: none;
    transition: background-color 120ms ease, color 120ms ease;
  }
  .button.primary { background: var(--crimson-deep); color: #fff; }
  .button.primary:hover { background: #73122a; border-color: #73122a; }
  .button.secondary { color: var(--crimson-deep); background: transparent; }
  .button.secondary:hover { background: #fff; }
  .button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  @media (min-width: 52rem) {
    main { grid-template-columns: 1.05fr 1fr; }
    .message { order: -1; }
  }
  .sticker {
    transform-box: fill-box;
    transform-origin: center;
    transform: rotate(-8deg);
    animation: slap 520ms cubic-bezier(.2, 1.6, .4, 1) 450ms both;
  }
  @keyframes slap {
    from { opacity: 0; transform: rotate(-3deg) scale(1.7); }
    60% { opacity: 1; }
    to { opacity: 1; transform: rotate(-8deg) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sticker { animation: none; }
  }
</style>
